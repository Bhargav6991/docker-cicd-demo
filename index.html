<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Docker CI/CD Demo</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #064e3b, #16a34a);
            color: white;
        }

        .container {
            text-align: center;
            padding: 50px;
            border-radius: 25px;
            background: rgba(255, 255, 255, 0.12);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(10px);
            max-width: 700px;
        }

        .badge {
            display: inline-block;
            padding: 8px 18px;
            border-radius: 30px;
            background: #22c55e;
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 25px;
        }

        h1 {
            font-size: 52px;
            margin-bottom: 15px;
        }

        h2 {
            font-size: 26px;
            font-weight: normal;
            margin-bottom: 25px;
        }

        p {
            font-size: 18px;
            line-height: 1.6;
            opacity: 0.9;
        }

        .pipeline {
            margin-top: 30px;
            font-size: 16px;
            font-weight: bold;
        }

        .arrow {
            margin: 0 8px;
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="badge">🐳 DOCKER CI/CD DEMO</div>

        <h1>🟢 GREEN VERSION</h1>

        <h2>Welcome to My DevOps Pipeline</h2>

        <p>
            This application is running inside a Docker container.
        </p>

        <div class="pipeline">
            GitHub
            <span class="arrow">→</span>
            Jenkins
            <span class="arrow">→</span>
            Docker
            <span class="arrow">→</span>
            Production
        </div>

    </div>

</body>
</html>
